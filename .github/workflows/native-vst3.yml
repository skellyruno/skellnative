name: SkellNative Windows VST3 (JUCE-free)

on:
  pull_request:
    paths:
      - "native/**"
      - "tools/**"
      - ".github/workflows/native-vst3.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - "tools/**"
      - ".github/workflows/native-vst3.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only cancel superseded PR runs; preserve main, release and manual checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  direct-vst3:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Regression-test strict VST3 metadata and prototype identities
        run: python -m unittest discover -s tests -v
      - name: Validate PowerShell 5.1 FL Studio preflight syntax
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/Run-FLStudio-Acceptance.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ("FL Studio runner syntax: " + ($parseErrors -join "; ")) }
      - name: Compile portable DSP and SkellDraw tests
        shell: pwsh
        run: |
          cmake -S native -B native/build -DSKELLNATIVE_BUILD_TESTS=ON
          cmake --build native/build --config Release --parallel 2
          ctest --test-dir native/build -C Release --output-on-failure
      - name: Configure official pinned Steinberg VST3 SDK
        shell: pwsh
        run: cmake -S native/vst3 -B native/vst3/build -A x64 -DSKELLNATIVE_BUILD_MINI=ON -DSKELLNATIVE_BUILD_SPACER=ON
      - name: Compile JUCE-free Windows VST3
        shell: pwsh
        run: cmake --build native/vst3/build --target SkellNativeGain SkellMiniNative SkellSpacerNative SkellNativeControlTests SpacerVst3Parity --config Release --parallel 2
      - name: Verify Mini validator, loaded audio and shared parameter runtime
        run: ctest --test-dir native/vst3/build -C Release --output-on-failure --no-tests=error
      - name: Capture real native Mini editor at 80, 100 and 200 percent
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/vst3/build -File -Recurse -Filter SpacerVst3Parity.exe | Select-Object -First 1
          if (-not $exe) { throw "Mini test host not built" }
          $bundle = (Join-Path (Resolve-Path native/vst3/build).Path "VST3/Release/Skell Mini Native DEV.vst3")
          New-Item -ItemType Directory -Force native/vst3/build/mini-screenshots | Out-Null
          & $exe.FullName --mini $bundle --capture (Resolve-Path native/vst3/build/mini-screenshots).Path
          if ($LASTEXITCODE -ne 0) { throw "Native Mini editor capture / lifecycle failed" }
      - name: Upload real native Mini editor screenshots
        uses: actions/upload-artifact@v7
        with:
          name: SkellMiniNative-Real-Windows-UI
          path: native/vst3/build/mini-screenshots/*.bmp
          if-no-files-found: error
          retention-days: 14
      - name: Capture real native Spacer editor at 80, 100 and 200 percent
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/vst3/build -File -Recurse -Filter SpacerVst3Parity.exe | Select-Object -First 1
          $bundle = Join-Path (Resolve-Path native/vst3/build).Path "VST3/Release/Skell Spacer Native DEV.vst3"
          New-Item -ItemType Directory -Force native/vst3/build/spacer-screenshots | Out-Null
          & $exe.FullName --capture-native $bundle (Resolve-Path native/vst3/build/spacer-screenshots).Path
          if ($LASTEXITCODE -ne 0) { throw "Native Spacer editor capture/lifecycle failed" }
      - name: Upload real Spacer Win32 editor screenshots
        uses: actions/upload-artifact@v7
        with:
          name: SkellSpacerNative-Real-Windows-UI
          path: native/vst3/build/spacer-screenshots/*.bmp
          if-no-files-found: error
          retention-days: 14
      - name: Check exact Windows x64 PE32+ VST3 bundle
        run: python -m tools.check_skellnative_vst3 native/vst3/build
      - name: Compile SkellDraw Win32 interaction smoke test
        shell: pwsh
        run: cmake --build native/vst3/build --target SkellDrawUiSmoke --config Release --parallel 2
      - name: Test native editor attach, paint and input
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/vst3/build -Recurse -File -Filter SkellDrawUiSmoke.exe | Select-Object -First 1
          if (-not $exe) { throw "Missing SkellDraw UI smoke test" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Native HWND/UI smoke failed" }
      - name: Compile exact-source VST3 audio adapter regression benchmark
        shell: pwsh
        run: cmake --build native/vst3/build --target SkellNativeVst3AdapterBench --config Release --parallel 2
      - name: Verify VST3 processor parity and automation test matrix
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/vst3/build -Recurse -File -Filter SkellNativeVst3AdapterBench.exe | Select-Object -First 1
          if (-not $exe) { throw "Missing native adapter regression executable" }
          & $exe.FullName | Set-Content vst3_adapter_profile.csv -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "VST3 adapter parity failed" }
          $lines = @(Get-Content vst3_adapter_profile.csv | Where-Object { $_ -match '^\d{5},' })
          if ($lines.Count -ne 72) { throw "Expected 72 native adapter test scenarios; got $($lines.Count)" }
      - name: Compile Steinberg official plugin validator
        shell: pwsh
        run: cmake --build native/vst3/build --target validator --config Release --parallel 2
      - name: Run official Steinberg VST3 host-compatibility validator
        run: python -m tools.validate_skellnative_vst3 native/vst3/build
      - name: Stage isolated VST3 bundles for local FL Studio acceptance (preflight only)
        shell: pwsh
        run: |
          $build = (Resolve-Path native/vst3/build).Path
          $gain = Join-Path $build "VST3/Release/SkellNativeGain.vst3"
          $mini = Join-Path $build "VST3/Release/Skell Mini Native DEV.vst3"
          $spacer = Join-Path $build "VST3/Release/Skell Spacer Native DEV.vst3"
          & ./scripts/Run-FLStudio-Acceptance.ps1 -Bundle @($gain, $mini, $spacer) -OutputRoot (Join-Path $build "flstudio-preflight")
          # This is a PowerShell script invoked in-process, not a native EXE:
          # LASTEXITCODE belongs to the previous CTest process and remains stale.
          # Script exceptions terminate this step automatically.
          $report = Get-ChildItem (Join-Path $build "flstudio-preflight") -Filter acceptance.json -Recurse | Select-Object -First 1
          if (-not $report) { throw "Missing acceptance report" }
          $json = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($json.checks.scan_and_load -ne "NOT_RUN" -or @($json.bundles).Count -ne 3) { throw "Preflight must not claim DAW success" }
      - name: Upload isolated FL Studio preflight report (not DAW evidence)
        uses: actions/upload-artifact@v7
        with:
          name: SkellNative-FLStudio-Acceptance-Preflight
          path: native/vst3/build/flstudio-preflight/**/acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental VST3 (not a stable release)
        uses: actions/upload-artifact@v7
        with:
          name: SkellNative-Gain-Experimental-Windows-VST3
          # Exclude the deliberately staged FL Studio preflight duplicate.
          # Only package the exact Release VST3 from the build output.
          path: native/vst3/build/VST3/Release/SkellNativeGain.vst3/**/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental Mini and Spacer VST3 for DAW acceptance
        uses: actions/upload-artifact@v7
        with:
          name: SkellNative-Mini-and-Spacer-Experimental-Windows-VST3
          path: |
            native/vst3/build/VST3/Release/Skell Mini Native DEV.vst3/**/*
            native/vst3/build/VST3/Release/Skell Spacer Native DEV.vst3/**/*
          if-no-files-found: error
          retention-days: 14
